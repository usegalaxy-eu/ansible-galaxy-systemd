---
- name: Deploy Galaxy SSE Monitor unit
  template:
    owner: root
    group: root
    mode: 0644
    src: galaxy-sse-monitor.service.j2
    dest: /etc/systemd/system/galaxy-sse-monitor.service
  notify: daemon reload

- name: Enable SSE monitor and ensure it is running
  systemd:
    name: galaxy-sse-monitor.service
    enabled: yes
    state: started
